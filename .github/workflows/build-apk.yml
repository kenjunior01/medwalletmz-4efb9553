name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/build-apk.yml'

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: env.json (mesma base de dados da versão web)
        run: |
          cat > env.json <<EOF
          {
            "SUPABASE_URL": "${{ secrets.SUPABASE_URL }}",
            "SUPABASE_ANON_KEY": "${{ secrets.SUPABASE_ANON_KEY }}"
          }
          EOF

      # F32 — assinatura de PRODUÇÃO: keystore decodificado dos secrets.
      # Sem os secrets o build continua (fallback debug no build.gradle).
      - name: Keystore de produção (dos secrets)
        env:
          MEDWALLET_KEYSTORE_B64: ${{ secrets.MEDWALLET_KEYSTORE_B64 }}
        run: |
          if [ -n "$MEDWALLET_KEYSTORE_B64" ]; then
            echo "$MEDWALLET_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/medwallet-release.jks"
            echo "MEDWALLET_STORE_FILE=$RUNNER_TEMP/medwallet-release.jks" >> "$GITHUB_ENV"
            echo "MEDWALLET_STORE_PASS=${{ secrets.MEDWALLET_STORE_PASS }}" >> "$GITHUB_ENV"
            echo "MEDWALLET_KEY_ALIAS=${{ secrets.MEDWALLET_KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "MEDWALLET_KEY_PASS=${{ secrets.MEDWALLET_KEY_PASS }}" >> "$GITHUB_ENV"
            echo "→ Keystore de produção carregado (APK/AAB assinados)"
          else
            echo "→ Sem keystore nos secrets — build assinado com debug"
          fi

      - name: Pub get
        run: flutter pub get

      # F32 — o strip nativo do AAB usa o NDK do plugin Flutter
      # (FlutterExtension.ndkVersion = 28.2.13676358 — fonte oficial).
      - name: NDK 28.2.13676358 (strip do AAB)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358" >/dev/null
          echo "→ NDK 28.2.13676358 instalado"

      - name: Build APK release (assinado)
        run: flutter build apk --release --dart-define-from-file=env.json

      - name: Build AAB (Play Store)
        run: flutter build appbundle --release --dart-define-from-file=env.json

      - name: Upload artefacto APK
        uses: actions/upload-artifact@v4
        with:
          name: medwallet-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload artefacto AAB
        uses: actions/upload-artifact@v4
        with:
          name: medwallet-aab
          path: apps/mobile/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
