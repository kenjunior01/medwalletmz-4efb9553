plugins {
    id "com.android.application"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "mz.medwallet"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        // F18: exigido pelo flutter_local_notifications (java.time etc.)
        coreLibraryDesugaringEnabled = true
    }

    externalNativeBuild {
        cmake {
            path = file("src/native/CMakeLists.txt")
            version = "3.22.1"
        }
    }

    defaultConfig {
        applicationId = "mz.medwallet"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = 26 // Jitsi SDK (F8) exige >= 26
        targetSdk = flutter.targetSdkVersion
        // Uses the version code from pubspec.yaml. When using split APKs, 1000 * ABI_VERSION
        // is added automatically by Flutter. (https://developer.android.com/studio/build/configure-apk-splits#configure-APK-versions)
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    // F31: sem keepDebugSymbols global em packaging.jniLibs — mantinha os
    // símbolos de debug do próprio motor (libflutter.so 157MB → APK 550MB).
    // O AGP faz o llvm-strip normal (NDK pré-instalado no CI / auto-download
    // licenciado localmente).

    // F32: assinatura de PRODUÇÃO — o CI fornece o keystore via env
    // (MEDWALLET_STORE_FILE etc., secrets do GitHub). Sem env → debug
    // (builds locais continuam a funcionar sem o keystore).
    signingConfigs {
        release {
            def ksPath = System.getenv("MEDWALLET_STORE_FILE")
            if (ksPath != null && file(ksPath).exists()) {
                storeFile = file(ksPath)
                storePassword = System.getenv("MEDWALLET_STORE_PASS")
                keyAlias = System.getenv("MEDWALLET_KEY_ALIAS") ?: "medwallet"
                keyPassword = System.getenv("MEDWALLET_KEY_PASS")
            }
        }
    }

    buildTypes {
        release {
            // Com keystore no CI → assinado com a chave de produção
            // (instalável e pronto para a Play Store); sem keystore →
            // debug (testes internos).
            def ksPath = System.getenv("MEDWALLET_STORE_FILE")
            def hasReleaseKey = ksPath != null && file(ksPath).exists()
            signingConfig = hasReleaseKey
                ? signingConfigs.release
                : signingConfigs.getByName("debug")
            // Sem extracao de simbolos nativos (so para Play Store).
            ndk { debugSymbolLevel = "NONE" }
        }
    }

    lint {
        checkReleaseBuilds = false
        abortOnError = false
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    // F18: desugaring do java.time em minSdk 26
    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")
}

flutter {
    source = "../.."
}
