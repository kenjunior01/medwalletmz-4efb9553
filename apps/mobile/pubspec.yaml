name: medwallet
description: "MedWallet MZ — Carteira digital de saúde de Moçambique. Consultas, farmácia, transportes e pagamentos M-Pesa numa só app."
publish_to: "none"
version: 0.6.0+18

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Backend — mesma instância Supabase do web (projeto pfqruzusjjxyidhqkiob)
  supabase_flutter: ^2.8.0

  # Estado — Riverpod 2.6
  flutter_riverpod: ^2.6.1

  # Navegação
  go_router: ^14.6.0

  # Tipografia premium (Plus Jakarta Sans + Inter)
  google_fonts: ^6.2.1

  # Micro-animações (stagger, spring, shimmer custom)
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0

  # Utilitários
  intl: ^0.19.0
  cupertino_icons: ^1.0.8

  # Instituições: abrir Google Maps / telefone / WhatsApp
  url_launcher: ^6.3.0

  # Chat: envio de receitas por fotografia
  image_picker: ^1.1.2

  # Ganhe (crowdsourcing): GPS para capturar a localização da instituição
  geolocator: ^13.0.1

  # Ganhe: escolher a localização exacta no Google Maps
  google_maps_flutter: ^2.10.0

  # Meddy Copilot (IA de gestão): respostas em Markdown
  flutter_markdown: ^0.7.4

  # F6: videochamada (abre sala Jitsi por link externo) + lembretes
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4

  # F8→F18 — a videochamada Jitsi abre por LINK EXTERNO (browser/app
  # Jitsi). O SDK nativo foi removido: trazia o React Native inteiro
  # como dependência (~500 MB no build) e não cabe no pipeline local;
  # a experiência de chamada mantém-se igual pela sala externa.

  # F8 — cache OFFLINE (sqflite local, sem codegen): laboratórios e
  # medicação continuam visíveis sem internet (stale-while-revalidate).
  sqflite: ^2.3.3
  path: ^1.9.0

  # F8 — push real (FCM), OPT-IN: só é inicializado com
  # --dart-define=FCM_ENABLED=true; sem Firebase configurado a app
  # funciona igual (notificações in-app + lembretes locais).
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

  # F9 — QR code da receita (ecrã Verificar receita; puro Dart, leve).
  qr_flutter: ^4.1.0

  # F11 — IA no dispositivo (Meddy, scanner, diário de voz): chamada
  # HTTPS directa ao Gemini, SEM SDK (mesma estratégia da web).
  # Chave OPT-IN via --dart-define=GEMINI_API_KEY=...
  http: ^1.2.2

  # F11 — gravação de áudio do Diário de Voz (m4a/AAC-LC).
  # Requer RECORD_AUDIO (Android) e NSMicrophoneUsageDescription (iOS).
  # F18 — scanner de QR em tempo real (receitas impressas, rota /scan-qr).
  mobile_scanner: ^7.0.1

  record: ^7.1.1  # F18: 5.x quebra no kernel AOT (record_linux/platform_interface) — 7.x corrige

  # F11 — directório temporário para os ficheiros de gravação.
  path_provider: ^2.1.4

  # F18 — bloqueio da app por biometria/PIN (exclusivo móvel, opt-in).
  local_auth: ^2.3.0

  # F18 — preferências locais do bloqueio de segurança (flag leve).
  shared_preferences: ^2.3.2

dependency_overrides:
  # path_provider_android 2.3.1 → jni/jni_flutter (build cmake que exige
  # NDK completo). A 2.2.x usa platform channels puros — mesma API.
  path_provider_android: 2.2.17

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0


flutter:
  uses-material-design: true

  # Ativar em F2 quando adicionarmos assets próprios:
  # assets:
  #   - assets/images/
  #   - assets/lottie/
