name: medwallet
description: "MedWallet MZ — Carteira digital de saúde de Moçambique. Consultas, farmácia, transportes e pagamentos M-Pesa numa só app."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Backend — mesma instância Supabase do web (projeto pfqruzusjjxyidhqkiob)
  supabase_flutter: ^2.8.0

  # Estado — Riverpod 2.6
  flutter_riverpod: ^2.6.1

  # Navegação
  go_router: ^14.6.0

  # Tipografia premium (Plus Jakarta Sans + Inter)
  google_fonts: ^6.2.1

  # Micro-animações (stagger, spring, shimmer custom)
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0

  # Utilitários
  intl: ^0.19.0
  cupertino_icons: ^1.0.8

  # Instituições: abrir Google Maps / telefone / WhatsApp
  url_launcher: ^6.3.0

  # Chat: envio de receitas por fotografia
  image_picker: ^1.1.2

  # Ganhe (crowdsourcing): GPS para capturar a localização da instituição
  geolocator: ^13.0.1

  # Ganhe: escolher a localização exacta no Google Maps
  google_maps_flutter: ^2.10.0

  # Meddy Copilot (IA de gestão): respostas em Markdown
  flutter_markdown: ^0.7.4

  # F6: videochamada (abre sala Jitsi por link externo) + lembretes
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4

  # F8 — SDK Jitsi EMBUTIDO: áudio/vídeo dentro da app (sem browser).
  # Requer: Android minSdkVersion ≥ 26 · iOS plataforma ≥ 15.
  # O ecrã de chamada faz fallback automático para o link externo
  # se o SDK falhar no dispositivo.
  jitsi_meet_flutter_sdk: ^11.0.0

  # F8 — cache OFFLINE (sqflite local, sem codegen): laboratórios e
  # medicação continuam visíveis sem internet (stale-while-revalidate).
  sqflite: ^2.3.3
  path: ^1.9.0

  # F8 — push real (FCM), OPT-IN: só é inicializado com
  # --dart-define=FCM_ENABLED=true; sem Firebase configurado a app
  # funciona igual (notificações in-app + lembretes locais).
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

  # F9 — QR code da receita (ecrã Verificar receita; puro Dart, leve).
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # Ativar em F2 quando adicionarmos assets próprios:
  # assets:
  #   - assets/images/
  #   - assets/lottie/
